apiVersion: v1
kind: Namespace
metadata:
  name: recreate

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-recreate
  namespace: recreate

spec:
  replicas: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx-container
          image: nginx:1.25
          ports:
            - containerPort: 80
