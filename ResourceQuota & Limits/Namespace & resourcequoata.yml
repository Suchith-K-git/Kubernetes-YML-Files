apiVersion: v1
kind: Namespace
metadata:
  name: mysql

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mysql-resource-quota
  namespace: mysql

spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi

    limits.cpu: "2"
    limits.memory: 4Gi

    pods: "5"

    requests.storage: 5Gi
    persistentvolumeclaims: "5"
